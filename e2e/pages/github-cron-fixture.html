<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #f6f8fa; color: #1f2328; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      header { padding: 18px 32px; border-bottom: 1px solid #d0d7de; background: #fff; }
      header strong { color: #0969da; }
      #files { width: min(1000px, calc(100% - 48px)); margin: 28px auto; }
      .file { margin-bottom: 24px; overflow: hidden; border: 1px solid #d0d7de; border-radius: 8px; background: #fff; box-shadow: 0 1px 0 rgb(27 31 36 / 4%); }
      .file::before { display: block; padding: 10px 16px; border-bottom: 1px solid #d0d7de; background: #f6f8fa; font: 600 13px ui-monospace, monospace; content: attr(data-path); }
      table { width: 100%; border-collapse: collapse; }
      td { height: 29px; padding: 3px 16px; border-bottom: 1px solid #f0f2f4; white-space: pre; font: 13px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace; }
      tr:last-child td { border-bottom: 0; }
    </style>
  </head>
  <body>
    <header><strong>acme/widgets</strong> · Pull request #42 · Files changed</header>
    <main id="files">
      <section class="file" data-path=".github/workflows/ci.yml">
        <table>
          <tr data-line-number="1"><td class="blob-code blob-code-addition">on:</td></tr>
          <tr data-line-number="2"><td class="blob-code blob-code-addition">  schedule:</td></tr>
          <tr data-line-number="3"><td class="blob-code blob-code-addition">    - cron: '*/5 * * * *'</td></tr>
          <tr data-line-number="4"><td class="blob-code blob-code-addition">      timezone: Asia/Tokyo</td></tr>
        </table>
      </section>
      <section class="file" data-path="deploy/cronjob.yaml">
        <table>
          <tr data-line-number="10"><td class="blob-code blob-code-context">kind: CronJob</td></tr>
          <tr data-line-number="11"><td class="blob-code blob-code-context">spec:</td></tr>
          <tr data-line-number="12"><td class="blob-code blob-code-deletion">  timeZone: UTC</td></tr>
          <tr data-line-number="12"><td class="blob-code blob-code-addition">  timeZone: Asia/Tokyo</td></tr>
          <tr data-line-number="13"><td class="blob-code blob-code-addition">  schedule: '0 3 * * 1'</td></tr>
        </table>
      </section>
    </main>
  </body>
</html>
